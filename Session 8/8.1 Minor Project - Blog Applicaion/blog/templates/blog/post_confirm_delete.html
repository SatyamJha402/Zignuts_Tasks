{% extends "blog/base.html" %}

<!-- Content block for the post deletion confirmation page -->
{% block content %}
    <div class="content-section">
        <!-- Form for confirming post deletion -->
        <form method="POST">
            {% csrf_token %}
            <fieldset class="form-group">
                <legend class="border-bottom mb-4">Delete Post</legend>
                <!-- Display confirmation message with post title -->
                <h2>Are you sure you want to delete the post "{{ object.title }}"?</h2>
            </fieldset>

            <!-- Buttons for confirming or canceling deletion -->
            <div class="form-group">
                <button class="btn btn-outline-danger" type="submit">Yes, Delete</button>
                <a class="btn btn-outline-secondary" href="{% url 'post-detail' object.id %}">No</a>
            </div>
        </form>
    </div>
{% endblock content %}
